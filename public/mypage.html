<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="/base.css">
  <title>マイページ | トーキャリ</title>
  <link rel="stylesheet" href="entry.css">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="entry.js"></script>
  <script src="purpose_map.js"></script>
  <style>
    .mp-hero{display:flex;align-items:center;gap:12px;padding:22px 18px 6px}
    .mp-hero .circ{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.25);flex-shrink:0}
    .mp-hero .circ img{width:86%;height:86%;object-fit:contain;border-radius:50%}
    .mp-hero h1{font-size:20px;font-weight:800;color:#fff;line-height:1.2}
    .mp-hero p{font-size:12px;color:rgba(255,255,255,0.78);margin-top:2px}

    .mp-sec{padding:14px 16px 2px}
    .mp-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
    /* 見出しは背景(紺グラデ)に依存せず両語が読めるよう、濃い紺の四方ハロー(擬似アウトライン)で白語を締める */
    .mp-t{font-size:15px;font-weight:800;color:#fff;
      text-shadow:0 1px 3px rgba(0,8,26,0.95), 0 -1px 2px rgba(0,8,26,0.8), 1px 0 2px rgba(0,8,26,0.8), -1px 0 2px rgba(0,8,26,0.8)}
    .mp-t .em{color:var(--gold)}
    .mp-more{font-size:12px;font-weight:700;color:rgba(255,255,255,0.8);text-decoration:none}

    .mp-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    .mp-mini{flex:0 0 auto;width:132px;background:#fff;color:var(--ink);border-radius:14px;padding:12px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,0.16)}
    .mp-mini .badge{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:"Reggae One",sans-serif;font-size:19px;color:#fff;margin-bottom:8px;background-color:var(--acc);background-image:linear-gradient(135deg,rgba(255,255,255,0.3),rgba(255,255,255,0) 62%)}
    .mp-mini .nm{font-size:13.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mp-mini .sub{font-size:11px;color:#8792a3;margin-top:3px}

    .mp-resume{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#12457f,#0a2f5c);border:1.5px solid rgba(231,184,75,0.5);border-radius:16px;padding:13px 15px;color:#fff;text-decoration:none;box-shadow:0 6px 18px rgba(3,20,44,0.4);margin-top:10px}
    .mp-resume .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .mp-resume .tx b{font-size:14.5px}.mp-resume .tx span{display:block;font-size:11.5px;color:rgba(255,255,255,0.82);margin-top:2px}
    .mp-resume .arrow{margin-left:auto;color:var(--gold);font-weight:700;font-size:20px}

    /* お気に入り */
    .mp-fav{display:flex;flex-direction:column;gap:10px}
    .mp-fav-card{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:14px;padding:12px 13px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.14)}
    .mp-fav-card .star{color:var(--gold);font-size:18px;flex-shrink:0}
    .mp-fav-card .fi{flex:1;min-width:0}
    .mp-fav-card .fn{font-size:15px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mp-fav-card .fd{font-size:11px;color:#7a8794;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mp-fav-card .fa{color:#c3ccd6;font-size:18px;font-weight:700;flex-shrink:0}

    /* 成績 */
    .mp-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,0.16);color:var(--ink)}
    .mp-stats{display:flex;gap:10px}
    .mp-stat{flex:1;text-align:center;background:#f4f7fb;border-radius:12px;padding:11px 6px}
    .mp-stat .v{font-size:22px;font-weight:800;color:var(--navy);line-height:1.1}
    .mp-stat .v small{font-size:12px;font-weight:700}
    .mp-stat .l{font-size:10.5px;color:#7a8794;margin-top:3px}
    .mp-scores{margin-top:11px;display:flex;flex-direction:column;gap:7px}
    .mp-score-row{display:flex;align-items:center;gap:10px;font-size:13px}
    .mp-score-row .sn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mp-score-row .bar{flex:1;height:7px;border-radius:99px;background:#eef2f7;overflow:hidden;min-width:40px}
    .mp-score-row .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
    .mp-score-row .sp{font-weight:800;color:var(--navy);width:38px;text-align:right;flex-shrink:0}

    /* 診断 */
    .mp-chip{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:4px 11px;margin:0 6px 6px 0}
    .mp-diag-co{font-size:13px;color:var(--ink);line-height:1.7}
    .mp-diag-co b{font-weight:700}
    .mp-diag-date{font-size:11px;color:#94a0ac;margin-top:8px}
    .mp-btn{display:block;text-align:center;margin-top:11px;background:var(--navy);color:#fff;text-decoration:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800}

    /* 空状態 */
    .mp-empty{background:rgba(255,255,255,0.06);border:1px dashed rgba(255,255,255,0.22);border-radius:14px;padding:16px;text-align:center;color:rgba(255,255,255,0.82)}
    .mp-empty p{font-size:13px;line-height:1.6;margin-bottom:10px}
    .mp-empty a{display:inline-block;background:var(--gold);color:#3a2c05;text-decoration:none;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:800}
    .mp-empty-all{padding:44px 22px;text-align:center}
    .mp-empty-all .ei{font-size:44px;margin-bottom:10px}
    .mp-empty-all .et{font-size:17px;font-weight:800;color:#fff;margin-bottom:6px}
    .mp-empty-all .es{font-size:13px;color:rgba(255,255,255,0.8);line-height:1.6;margin-bottom:16px}
    .mp-empty-all a{display:inline-block;background:var(--gold);color:#3a2c05;text-decoration:none;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:800}
    .mp-load{text-align:center;color:rgba(255,255,255,0.7);padding:50px 0}

    /* v1.5: レベル＆称号 */
    .lv-card{background:linear-gradient(135deg,#12457f,#0a2f5c);border:1.5px solid rgba(231,184,75,0.45);border-radius:16px;padding:15px;box-shadow:0 6px 18px rgba(3,20,44,0.4)}
    .lv-top{display:flex;align-items:center;gap:12px}
    .lv-badge-ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
    .lv-name{font-size:17px;font-weight:800;color:#fff}
    .lv-sub{font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px}
    .lv-xp{margin-left:auto;text-align:right;color:var(--gold);font-weight:800;font-size:15px}.lv-xp small{color:rgba(255,255,255,0.6);font-weight:600;font-size:10px;display:block}
    .lv-bar{height:8px;border-radius:99px;background:rgba(255,255,255,0.14);overflow:hidden;margin:11px 0 4px}
    .lv-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
    .lv-next{font-size:10.5px;color:rgba(255,255,255,0.7);text-align:right}
    .lv-badges{display:flex;gap:8px;overflow-x:auto;margin-top:11px;padding-bottom:3px;-webkit-overflow-scrolling:touch}
    .lv-b{flex:0 0 auto;width:74px;text-align:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:11px;padding:9px 5px}
    .lv-b.on{background:rgba(231,184,75,0.16);border-color:rgba(231,184,75,0.55)}
    .lv-b .bi{font-size:20px;filter:grayscale(1);opacity:0.5}
    .lv-b.on .bi{filter:none;opacity:1}
    .lv-b .bl{font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.7);line-height:1.2;margin-top:4px}
    .lv-b.on .bl{color:#fff}
    .lv-b .bd{font-size:9px;color:rgba(255,255,255,0.55);margin-top:2px}

    /* v1.5: スタンプラリー */
    .rl-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .rl-cell{background:#fff;border-radius:12px;padding:11px 12px;text-decoration:none;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,0.14)}
    .rl-cell.done{background:linear-gradient(135deg,#fff,#fff7e6);box-shadow:0 2px 10px rgba(231,184,75,0.3)}
    .rl-nm{font-size:13px;font-weight:800;display:flex;align-items:center;gap:5px}
    .rl-nm .st{font-size:14px}
    .rl-cnt{font-size:11px;color:#7a8794;margin-top:4px}
    .rl-cnt b{color:var(--navy);font-weight:800}
    .rl-bar{height:5px;border-radius:99px;background:#eef2f7;overflow:hidden;margin-top:6px}
    .rl-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
    .rl-cell.unexp{opacity:0.92}
    .rl-cell.unexp .rl-cnt{color:#a7b0bb}
    .rl-cell .rl-todo{font-size:10.5px;color:#c8912a;font-weight:800}

    /* FB②: 目的の常時展開(コンパクト2列・カードを積まず縦を抑える) */
    .mp-goals-wrap{padding:12px 16px 2px}
    .mp-goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .mp-goal{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:9px 10px;text-decoration:none;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,0.13);-webkit-tap-highlight-color:transparent}
    .mp-goal:active{transform:scale(0.98)}
    .mp-goal .gi{font-size:17px;flex-shrink:0;width:22px;text-align:center}
    .mp-goal .gl{font-size:12px;font-weight:700;line-height:1.25}
    /* FB①: レベル 現在地/上限・次アクション・算出根拠 */
    .lv-cap{margin-left:auto;text-align:right;color:#fff;font-weight:700;font-size:13px;line-height:1.2}
    .lv-cap b{color:var(--gold);font-size:21px;font-weight:800}
    .lv-cap small{color:rgba(255,255,255,0.6);font-weight:600;font-size:10px;display:block;margin-top:2px}
    .lv-actions{margin-top:12px;background:rgba(255,255,255,0.07);border-radius:12px;padding:10px 11px}
    .lv-actions .at{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:8px}
    .lv-act{display:flex;align-items:center;gap:9px;background:#fff;border-radius:10px;padding:9px 11px;text-decoration:none;color:var(--ink);margin-bottom:7px;box-shadow:0 1px 5px rgba(0,0,0,0.12)}
    .lv-act:last-child{margin-bottom:0}
    .lv-act .ai{font-size:16px;flex-shrink:0}
    .lv-act .al{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.3}
    .lv-act .ax{font-size:10.5px;font-weight:800;color:#2d8659;background:#e7f4ec;border-radius:999px;padding:2px 7px;flex-shrink:0}
    .lv-act .aa{color:#c3ccd6;font-size:16px;font-weight:700;flex-shrink:0}
    .lv-help{background:none;border:none;color:rgba(255,255,255,0.78);font-size:11px;font-weight:700;cursor:pointer;padding:9px 0 0;text-decoration:underline;font-family:inherit}
    .lv-explain{margin-top:8px;background:rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px;font-size:11px;color:rgba(255,255,255,0.86);line-height:1.65}
    .lv-explain b{color:var(--gold)}
    /* FB③: スタンプ 説明導線 */
    .rl-help{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,0.18);color:#fff;border:none;font-size:12px;font-weight:800;cursor:pointer;margin-left:7px;line-height:18px;font-family:inherit;padding:0}
    .rl-explain{background:rgba(255,255,255,0.06);border-radius:10px;padding:11px 13px;font-size:11.5px;color:rgba(255,255,255,0.87);line-height:1.65;margin-bottom:9px}
    .rl-explain b{color:var(--gold)}

    /* v1.5: 次に見るべき3社 */
    .n3-card{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:12px 13px;text-decoration:none;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,0.14);margin-bottom:9px}
    .n3-badge{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:"Reggae One",sans-serif;font-size:19px;color:#fff;background-color:var(--acc);background-image:linear-gradient(135deg,rgba(255,255,255,0.3),rgba(255,255,255,0) 62%)}
    .n3-info{flex:1;min-width:0}.n3-nm{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.n3-sub{font-size:11px;color:#7a8794;margin-top:1px}
    .n3-match{flex-shrink:0;font-size:11px;font-weight:800;color:#fff;background:var(--navy);border-radius:999px;padding:3px 9px}
    .n3-arrow{color:#c3ccd6;font-size:18px;font-weight:700;flex-shrink:0}
    .n3-foot{font-size:11px;color:#7a8794;line-height:1.6;margin-top:2px}
    .n3-foot a{color:var(--navy);font-weight:800;text-decoration:underline;margin-left:3px}

    /* v1.5: 更新フィード */
    .fd-item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:12px;padding:11px 13px;text-decoration:none;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,0.14);margin-bottom:8px}
    .fd-ic{width:36px;height:36px;border-radius:10px;background:#eef3f9;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .fd-b{flex:1;min-width:0}.fd-t{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fd-d{font-size:11px;color:#7a8794;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fd-date{font-size:10.5px;color:#94a0ac;flex-shrink:0}
    .fd-sub{font-size:11px;color:rgba(255,255,255,0.6);padding:2px 2px 8px}

    /* v1.6: ニュースやさしい表示（タグ＋一言ガイド＋用語辞書） */
    .nw-item{background:#fff;border-radius:12px;padding:12px 13px;box-shadow:0 2px 8px rgba(0,0,0,0.14);margin-bottom:8px}
    .nw-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .nw-tag{font-size:10.5px;font-weight:800;color:#fff;padding:2px 9px;border-radius:999px;flex-shrink:0}
    .nw-tag.t-kessan{background:#c0392b}.nw-tag.t-product{background:#1f8a4c}.nw-tag.t-hire{background:#d17d00}
    .nw-tag.t-ma{background:#7d3c98}.nw-tag.t-hr{background:#2f6fb0}.nw-tag.t-info{background:#64748b}
    .nw-date{font-size:10.5px;color:#94a0ac;margin-left:auto;flex-shrink:0}
    .nw-new{font-size:9px;font-weight:900;color:#fff;background:#e6394f;padding:2px 7px;border-radius:999px;flex-shrink:0;letter-spacing:0.05em;box-shadow:0 1px 5px rgba(230,57,79,0.55)}
    /* 新着ジャンプカード(最上部・通知で来た人をニュースへ誘導) */
    .mp-newsjump{display:flex;align-items:center;gap:9px;margin:10px 16px 2px;padding:14px 16px;background:linear-gradient(135deg,#e6394f,#b8283c);border-radius:14px;color:#fff;text-decoration:none;font-size:14px;font-weight:800;box-shadow:0 6px 18px rgba(230,57,79,0.42)}
    .mp-newsjump .nj-ic{font-size:20px;flex-shrink:0}
    .mp-newsjump b{margin-left:auto;font-size:13px;white-space:nowrap}
    .nw-title{font-size:13.5px;font-weight:700;line-height:1.55;color:var(--ink)}
    /* v1.6強化: タップでアコーディオン展開 */
    .nw-head{cursor:pointer;-webkit-tap-highlight-color:transparent}
    .nw-chev{font-size:10px;color:#b3bdc8;flex-shrink:0;transition:transform .2s}
    .nw-item.open .nw-chev{transform:rotate(180deg)}
    .nw-exp{display:none;margin-top:9px}
    .nw-item.open .nw-exp{display:block}
    .nw-summary{font-size:12.5px;color:var(--ink);line-height:1.6;background:#eef4fb;border-radius:8px;padding:9px 11px}
    .nw-slabel{display:block;font-size:10.5px;font-weight:800;color:#2f6fb0;margin-bottom:3px}
    .nw-soon{color:#8a94a0;font-style:italic}
    .nw-guide{font-size:11.5px;color:#5a6675;line-height:1.55;margin-top:6px;background:#f4f7fb;border-radius:8px;padding:6px 9px}
    .nw-guide .gi{margin-right:3px}
    .nw-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
    .nw-name{font-size:11px;color:#7a8794;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nw-link{font-size:11.5px;font-weight:700;color:var(--nana,#2f6fb0);text-decoration:none;flex-shrink:0;margin-left:10px}
    .nw-link::after{content:" ↗"}
    .gl{border-bottom:1.5px dotted #2f6fb0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    /* 用語ポップ */
    .gl-pop{position:fixed;z-index:240;max-width:280px;background:#0e2a4d;color:#fff;border-radius:12px;padding:11px 13px;box-shadow:0 8px 26px rgba(0,0,0,0.4);font-size:12.5px;line-height:1.6}
    .gl-pop .gt{font-weight:800;color:var(--gold,#e7b84b);display:block;margin-bottom:3px;font-size:13px}
    .gl-pop .gd{color:#eaf1fa}
    .gl-pop::after{content:"";position:absolute;width:12px;height:12px;background:inherit;transform:rotate(45deg)}
    .gl-pop.below::after{top:-6px;left:var(--ax,20px)}
    .gl-pop.above::after{bottom:-6px;left:var(--ax,20px)}

    /* v1.7: お気に入り/ニュースの 検索・絞り込み・並び替え・追加読み込み */
    .fav-ctrl,.nw-ctrl{margin-bottom:10px}
    .fav-search{width:100%;border:none;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:rgba(255,255,255,0.94);box-shadow:0 2px 8px rgba(0,0,0,0.12);margin-bottom:8px}
    .fav-sorts,.nw-sorts{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
    .fav-sortb,.nw-sortb{flex:0 0 auto;font-size:12px;font-weight:700;color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);border-radius:999px;padding:6px 13px;cursor:pointer;font-family:inherit}
    .fav-sortb.on,.nw-sortb.on{background:var(--gold);color:#3a2c05;border-color:var(--gold)}
    .fav-chips,.nw-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
    .fav-chip,.nw-chip{flex:0 0 auto;font-size:11.5px;font-weight:700;color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:999px;padding:5px 11px;cursor:pointer;font-family:inherit;white-space:nowrap}
    .fav-chip.on,.nw-chip.on{background:rgba(231,184,75,0.2);border-color:var(--gold);color:#fff}
    .mp-fav-empty,.nw-empty{background:rgba(255,255,255,0.06);border:1px dashed rgba(255,255,255,0.22);border-radius:12px;padding:16px;text-align:center;color:rgba(255,255,255,0.8);font-size:13px}
    /* ニュース: 企業バッジ(タップ前に一目で分かる=学生FBの核) */
    .nw-co{font-size:10.5px;font-weight:800;color:#fff;padding:2px 9px;border-radius:999px;background-color:var(--acc);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
    .nw-more{display:block;width:100%;margin-top:2px;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}

    /* 初回プロフィール登録モーダル */
    .pm-overlay{position:fixed;inset:0;background:rgba(6,20,40,0.74);z-index:200;display:flex;align-items:flex-end;justify-content:center}
    .pm-card{background:#fff;color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow-y:auto}
    .pm-h1{font-size:12.5px;font-weight:800;color:var(--navy);text-align:center}
    .pm-h2{font-size:18px;font-weight:800;text-align:center;margin:7px 0 5px;line-height:1.35}
    .pm-lead{font-size:12.5px;color:#5a6675;line-height:1.65;text-align:center;margin-bottom:14px}
    .pm-q{font-size:14px;font-weight:800;margin:12px 0 8px}
    .pm-opts{display:flex;flex-direction:column;gap:9px}
    .pm-opt{display:flex;align-items:center;gap:11px;border:2px solid #e2e8f0;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer;background:#fff;text-align:left;width:100%;font-family:inherit;color:var(--ink)}
    .pm-opt.on{border-color:var(--navy);background:#eef4fb}
    .pm-opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;flex-shrink:0}
    .pm-opt.on .rd{border-color:var(--navy);background:var(--navy);box-shadow:inset 0 0 0 3px #fff}
    .pm-field{margin-top:12px}
    .pm-label{font-size:12px;font-weight:800;color:#5a6675;margin-bottom:5px;display:block}
    .pm-input,.pm-select{width:100%;border:2px solid #e2e8f0;border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
    .pm-sugg{border:1px solid #e2e8f0;border-radius:10px;margin-top:5px;max-height:190px;overflow-y:auto;background:#fff}
    .pm-sugg div{padding:11px 13px;border-bottom:1px solid #f1f4f8;font-size:14px;cursor:pointer}
    .pm-sugg div:active{background:#f4f7fb}
    .pm-note{background:#f6f8fb;border-radius:12px;padding:12px 13px;margin-top:16px;font-size:11.5px;color:#5a6675;line-height:1.75}
    .pm-note b{color:var(--ink)}
    .pm-consent{display:flex;align-items:flex-start;gap:10px;margin-top:14px;font-size:13.5px;font-weight:700;line-height:1.5;cursor:pointer;color:var(--ink)}
    .pm-consent input{width:20px;height:20px;margin-top:1px;flex-shrink:0}
    .pm-submit{width:100%;margin-top:16px;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:800;background:var(--gold);color:#3a2c05;cursor:pointer;font-family:inherit}
    .pm-submit:disabled{background:#e2e8f0;color:#9aa5b1;cursor:default}
    .pm-del{display:block;text-align:center;margin-top:12px;color:#c0392b;font-size:12.5px;font-weight:700;background:none;border:none;cursor:pointer;width:100%;font-family:inherit}
    .pm-edit{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:inherit}
  </style>
</head>
<body>
<div class="e-wrap">
  <header class="e-header">
    <div class="mp-hero">
      <span class="circ"><img src="/images/brand/tokyari_logo_mark.jpg" alt="トーキャリ"></span>
      <div><h1>マイページ</h1><p id="mp-greet">📓 あなたの就活記録 — 足あと・お気に入り・成績・診断・ニュース</p></div>
    </div>
  </header>
  <style>
    .mp-start{display:grid;grid-template-columns:1fr;gap:11px;padding:12px 16px 2px} /* TEMP(2026-08-03): /advisor停止中は1列。復帰時 1fr → 1fr 1fr */
    .mp-start a{display:flex;flex-direction:column;gap:8px;padding:14px 13px;border-radius:16px;text-decoration:none;color:#fff;box-shadow:0 6px 18px rgba(3,20,44,0.42);background:linear-gradient(135deg,#12457f,#0a2f5c);border:1.5px solid rgba(231,184,75,0.5);-webkit-tap-highlight-color:transparent}
    .mp-start a:active{transform:scale(0.98)}
    .mp-start .si{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));flex-shrink:0}
    .mp-start .sb{font-size:14px;font-weight:800;line-height:1.3}
    .mp-start .ss{font-size:11px;color:rgba(255,255,255,0.82);line-height:1.4}
  </style>
  <!-- 2大入口(マイページ版): home版と別idで計測し設置場所を比較 -->
  <!-- FB②: 「今日は何をする？」を常時展開。8目的の定義は purpose_map.js が唯一の正(mypageに書き写さない)。押さないと出ない旧ボタンは廃止。 -->
  <div class="mp-goals-wrap">
    <div class="mp-h" style="margin-bottom:8px"><span class="mp-t">今日は<span class="em">何をする？</span></span></div>
    <div class="mp-goals" id="mp-goals"></div>
  </div>
  <!-- 一時停止(2026-08-03・安全): /advisor 入口は「Fが全項目合格」報告まで非表示。コードは保持。復帰=このcommentを外すだけ(mp-start単独=全幅表示)。
  <div class="mp-start">
    <a href="/advisor" onclick="if(window.tkEvent)tkEvent('menu','AIキャリアナビ(mypage)')">
      <span class="si">🤖</span><span class="sb">AIキャリアナビに聞く</span><span class="ss">迷ったら相談・道案内</span></a>
  </div>
  -->
  <div id="mp"><div class="mp-load">読み込み中…</div></div>
  <footer class="e-footer"><span class="brand-panel"><img class="brand-logo" src="/images/brand/tokyari_logo_wide.png" alt="トーキャリ"></span></footer>
</div>
<script>
const CFG=window.TOKYARI||{};
const LIFF_ID=CFG.LIFF_HUB||'2010075487-89AJxZnA';
const API_BASE=CFG.API_BASE||'https://10koma-shukatsu-api.oscar-dodds.workers.dev';
let userId=new URLSearchParams(location.search).get('u')||'guest-preview';
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const PAL=['#2f6fb0','#c0392b','#7d3c98','#16a085','#d17d00','#2d8659','#c0448a','#3b5bdb','#b8823a','#2f8fbf'];
function hue(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length];}
const mp=()=>document.getElementById('mp');

function secContinue(d){
  const rec=d.continue.recent||[], rz=d.continue.quiz_resume;
  if(!rec.length && !rz){
    return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">続き<span class="em">から</span></span></div>
      <div class="mp-empty"><p>まだ足あとがありません。<br>気になる企業から見てみよう。</p><a href="/industry">企業研究へ →</a></div></div>`;
  }
  const cards=rec.map(c=>`<a class="mp-mini" href="/company.html?id=${encodeURIComponent(c.id)}&from=mypage">
      <span class="badge" style="--acc:${hue(c.id)}">${esc(String(c.name||'？').charAt(0))}</span>
      <span class="nm">${esc(c.name)}</span><span class="sub">最近見た企業</span></a>`).join('');
  const resume=rz?`<a class="mp-resume" href="/quiz.html?company=${encodeURIComponent(rz.set_id)}&name=${encodeURIComponent(rz.name)}&from=mypage">
      <span class="ic">🧠</span><span class="tx"><b>クイズの続き</b><span>${esc(rz.name)}（${rz.answered}/${rz.total}問）</span></span><span class="arrow">›</span></a>`:'';
  return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">続き<span class="em">から</span></span></div>
    ${rec.length?`<div class="mp-row">${cards}</div>`:''}${resume}</div>`;
}

// ===== お気に入り: 検索・業界絞り込み・並び替え(追加順/閲覧順/社名) =====
let FAV=[];                                   // お気に入りデータ(絞り込み/並び替えのソース)
let favState={q:'',ind:'',sort:'added'};
function favCard(c){
  const sub=c.industry||c.description||'';
  return `<a class="mp-fav-card" href="/company.html?id=${encodeURIComponent(c.id)}&from=mypage">
    <span class="star">★</span><span class="fi"><span class="fn">${esc(c.name)}</span>${sub?`<span class="fd">${esc(sub)}</span>`:''}</span><span class="fa">›</span></a>`;
}
function applyFav(){
  const q=favState.q.trim().toLowerCase();
  let list=FAV.filter(c=>{
    if(favState.ind && c.industry!==favState.ind) return false;
    if(q && !String(c.name||'').toLowerCase().includes(q) && !String(c.id||'').toLowerCase().includes(q)) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(favState.sort==='name') return String(a.name||'').localeCompare(String(b.name||''),'ja');
    if(favState.sort==='viewed') return String(b.last_viewed||'').localeCompare(String(a.last_viewed||''));
    return String(b.created_at||'').localeCompare(String(a.created_at||''));   // 追加順(新しい順)
  });
  const el=document.getElementById('fav-list'); if(el) el.innerHTML = list.length? list.map(favCard).join('') : `<div class="mp-fav-empty">条件に合うお気に入りがありません</div>`;
  const cnt=document.getElementById('fav-count'); if(cnt) cnt.textContent=`${list.length}/${FAV.length}社`;
}
function secFavorites(d){
  const b=d.bookmarks||[]; FAV=b; favState={q:'',ind:'',sort:'added'};
  if(!b.length){
    return `<div class="mp-sec" id="favorites"><div class="mp-h"><span class="mp-t">お気に<span class="em">入り</span></span></div>
      <div class="mp-empty"><p>まだ保存した企業はありません。<br>企業ページの「保存」で、あとで見返せます。</p><a href="/industry">企業をさがす →</a></div></div>`;
  }
  const inds=[...new Set(b.map(c=>c.industry).filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),'ja'));
  const controls = b.length>=2 ? `<div class="fav-ctrl">
      <input class="fav-search" id="fav-search" type="search" placeholder="お気に入りを検索（社名）" autocomplete="off" enterkeyhint="search">
      <div class="fav-sorts">
        <button class="fav-sortb on" data-s="added">追加順</button>
        <button class="fav-sortb" data-s="viewed">閲覧順</button>
        <button class="fav-sortb" data-s="name">社名</button>
      </div>
      ${inds.length>1?`<div class="fav-chips"><button class="fav-chip on" data-ind="">すべて</button>${inds.map(i=>`<button class="fav-chip" data-ind="${esc(i)}">${esc(i)}</button>`).join('')}</div>`:''}
    </div>` : '';
  return `<div class="mp-sec" id="favorites"><div class="mp-h"><span class="mp-t">お気に<span class="em">入り</span></span><span class="mp-more" id="fav-count">${b.length}社</span></div>
    ${controls}<div class="mp-fav" id="fav-list">${b.map(favCard).join('')}</div></div>`;
}

function secStats(d){
  const s=d.quiz_stats||{};
  if(!s.answered){
    return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">あなたのクイズ<span class="em">成績</span></span></div>
      <div class="mp-empty"><p>まだクイズの記録がありません。<br>1問解くと成績がここに出ます。</p><a href="/quiz-list">クイズがある企業を探す →</a></div></div>`;
  }
  const acc=(s.accuracy==null?'—':s.accuracy);
  const rows=(s.recent_scores||[]).map(r=>`<div class="mp-score-row">
      <span class="sn" style="flex:0 0 92px">${esc(r.name)}</span>
      <span class="bar"><i style="width:${Math.max(4,r.score)}%"></i></span>
      <span class="sp">${r.score}%</span></div>`).join('');
  return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">あなたのクイズ<span class="em">成績</span></span><a class="mp-more" href="/quiz-list">クイズがある企業 →</a></div>
    <div class="mp-card">
      <div class="mp-stats">
        <div class="mp-stat"><div class="v">${s.companies}<small>社</small></div><div class="l">受験社数</div></div>
        <div class="mp-stat"><div class="v">${acc}<small>${acc==='—'?'':'%'}</small></div><div class="l">累計正答率</div></div>
        <div class="mp-stat"><div class="v">${s.answered}<small>問</small></div><div class="l">回答数</div></div>
      </div>
      ${rows?`<div class="mp-scores">${rows}</div>`:''}
    </div></div>`;
}

// 保存済み診断のcreated_at(ISO/D1 datetime)→「M月D日」。学生が"いつの結果か=古くないか"を判断できるように。
function jpDate(iso){
  const s=String(iso||'').slice(0,10); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?`${+m[2]}月${+m[3]}日`:'';
}
function secShindan(d){
  const sh=d.shindan;
  if(!sh){
    return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">あなたの<span class="em">診断結果</span></span></div>
      <div class="mp-empty"><p>まだ診断していません。<br>数問であなたに合う業界・企業がわかります。</p><a href="/shindan.html">相性診断をする →</a></div></div>`;
  }
  const inds=(sh.top_industries||[]).slice(0,3).map(i=>`<span class="mp-chip">${esc(i.industry||i.name||'')}</span>`).join('');
  const cos=(sh.top_companies||[]).slice(0,3).map(c=>esc(c.name)).join('、');
  const date=jpDate(sh.created_at);
  return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">あなたの<span class="em">診断結果</span></span></div>
    <div class="mp-card">
      <div style="font-size:12px;color:#7a8794;font-weight:700;margin-bottom:6px">おすすめ業界</div>${inds||'<span class="mp-chip">—</span>'}
      ${cos?`<div class="mp-diag-co" style="margin-top:8px"><b>おすすめ企業：</b>${cos}</div>`:''}
      ${date?`<div class="mp-diag-date">${esc(date)}の診断結果</div>`:''}
      <a class="mp-btn" href="/shindan.html">もう一度診断する</a>
    </div></div>`;
}

// v2(FB①): 就活レベル＝現在地/上限・次アクション(具体・直リンク)・算出根拠(1タップ)
const MAXLV = 5;                          // backend TIERS(api/src/index.ts)の段数。増減時は要同期。
const LV_TIERS = [0,200,700,1800,4000];   // 各Lvの必要XP(表示用・backendと一致)
// 次のレベルまでの具体アクション(トーキャリ内の実行動に紐づけ＋直リンク。抽象語は出さない)
function levelActions(L){
  if(L.next_xp==null) return '';          // 最高レベル=近道不要
  const bd=L.breakdown||{}; let gap=Math.max(0,(L.next_xp||0)-(L.xp||0));
  const acts=[];
  if(!bd.shindan){ acts.push({ic:'🧭',l:'相性診断をする',xp:'+50XP',href:'/shindan.html?from=mypage'}); gap-=50; }
  if(gap>0){ const n=Math.min(5,Math.max(1,Math.ceil(gap/10))); acts.push({ic:'🏢',l:`企業をあと${n}社見る`,xp:`+${n*10}XP`,href:'/industry?from=mypage'}); }
  if(acts.length<3){ acts.push({ic:'🧠',l:'クイズで正解を増やす',xp:'+10〜80XP',href:'/quiz.html?from=mypage'}); }
  return `<div class="lv-actions"><div class="at">⚡ 次のレベルまでの近道（押すとそのページへ）</div>${acts.slice(0,3).map(a=>`
      <a class="lv-act" href="${a.href}"><span class="ai">${a.ic}</span><span class="al">${esc(a.l)}</span><span class="ax">${a.xp}</span><span class="aa">›</span></a>`).join('')}</div>`;
}
function secLevel(d){
  const L=d.level||{}; const bd=L.breakdown||{};
  const icons={first:'👣',shosha5:'🏢',quiz10:'🧠',quiz100:'💯',ind_half:'🗺️',ind_all:'👑'};
  const badges=(L.badges||[]).map(b=>`<div class="lv-b ${b.earned?'on':''}"><div class="bi">${icons[b.id]||'⭐'}</div><div class="bl">${esc(b.label)}</div>${b.detail?`<div class="bd">${esc(b.detail)}</div>`:''}</div>`).join('');
  const gap=L.next_xp!=null?Math.max(0,L.next_xp-(L.xp||0)):0;
  const nextLine=L.next_xp!=null?`次のLv.${(L.level||1)+1}まで あと<b style="color:var(--gold)">${gap}</b>XP`:'🎉 最高レベル達成！';
  const explain=`<div class="lv-explain" id="lv-explain" hidden>
      <b>XP</b>＝ 企業を見る(1社+10) ＋ クイズ正解(難易度で+10〜80) ＋ 相性診断(+50)。<br>
      レベルの節目: ${LV_TIERS.map((t,i)=>`Lv.${i+1}=${t}`).join(' / ')} XP。<br>
      いまの内訳: 企業${bd.companies||0}社=+${(bd.companies||0)*10} ／ クイズ=+${bd.quiz_xp||0} ／ 診断=${bd.shindan?'+50':'0'} ＝ 合計 <b>${L.xp||0}XP</b>。</div>`;
  return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">就活<span class="em">レベル</span></span></div>
    <div class="lv-card">
      <div class="lv-top"><span class="lv-badge-ic">🎓</span>
        <span><div class="lv-name">${esc(L.level_name||'')}</div>
          <div class="lv-sub">閲覧${bd.companies||0}社・クイズ正答${bd.quiz_correct||0}・診断${bd.shindan?'済':'未'}</div></span>
        <span class="lv-cap"><b>Lv.${L.level||1}</b> / Lv.${MAXLV}<small>${L.xp||0} XP</small></span></div>
      <div class="lv-bar"><i style="width:${L.progress||0}%"></i></div>
      <div class="lv-next">${nextLine}</div>
      ${levelActions(L)}
      <button class="lv-help" data-lvhelp>ℹ️ レベルはどう決まる？（タップ）</button>
      ${explain}
      <div class="lv-badges">${badges}</div>
    </div></div>`;
}
// v1.5: 次に見るべき3社
function secNext3(d){
  const n3=d.next3||[];
  if(!n3.length){
    if(d.shindan) return '';  // 診断済だが未閲覧候補が無い→非表示
    return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">次に見る<span class="em">べき3社</span></span></div>
      <div class="mp-empty"><p>相性診断をすると、<br>あなたに合う企業を提案します。</p><a href="/shindan.html">診断してみる →</a></div></div>`;
  }
  const dstr=jpDate(d.shindan&&d.shindan.created_at);
  return `<div class="mp-sec"><div class="mp-h"><span class="mp-t">次に見る<span class="em">べき3社</span></span><span class="mp-more">${dstr?esc(dstr)+'の診断より':'診断より'}</span></div>
    ${n3.map(c=>`<a class="n3-card" href="/company.html?id=${encodeURIComponent(c.slug)}&from=mypage">
      <span class="n3-badge" style="--acc:${hue(c.slug)}">${esc(String(c.name||'？').charAt(0))}</span>
      <span class="n3-info"><span class="n3-nm">${esc(c.name)}</span><span class="n3-sub">${esc(c.industry||'')}</span></span>
      ${(c.score!=null)?`<span class="n3-match">相性${Math.round(c.score*100)}%</span>`:''}<span class="n3-arrow">›</span></a>`).join('')}
    <div class="n3-foot">${dstr?`この相性％は<b>${esc(dstr)}</b>の診断結果です。`:'この相性％は前回の診断結果です。'}最新の企業情報で見直すには<a href="/shindan.html?from=mypage">再診断する</a></div></div>`;
}
// 業界名(D1 stamp_rally) → 業界研究(gyokai)slug の対応表。gyokai.html の INDUSTRIES と同一。
// 正規化(空白/中黒/長音などを除去)して照合＝表記ゆれに強い。未対応名は open を付けず素通り(退行なし)。
const RALLY_SLUGS=[
  ['総合商社','sogo-shosha'],['専門商社','senmon-shosha'],['銀行・証券・保険','finance'],
  ['IT・AI・SaaS・ゲーム','it-ai-saas-game'],['コンサル','consulting'],['メーカー','manufacturer'],
  ['広告・メディア','ad-media'],['インフラ・エネルギー','infra-energy'],['不動産・建設','realestate-construction'],
  ['小売・流通','retail'],['食品・飲料','food-beverage'],['医療・ヘルスケア','medical-healthcare'],
  ['航空・運輸・物流','transport-logistics'],['教育・人材','education-hr'],['スタートアップ','startup'],
  ['ディープテック・宇宙・AI','deeptech-space-ai'],
];
function rallyNorm(s){ return String(s||'').replace(/[\s・･・　]/g,'').replace(/[（(].*?[)）]/g,'').toLowerCase(); }
const RALLY_NAME2SLUG=(()=>{ const m={}; RALLY_SLUGS.forEach(([n,s])=>{ m[rallyNorm(n)]=s; }); return m; })();
function rallySlug(name){ return RALLY_NAME2SLUG[rallyNorm(name)]||''; }

// 取得済みスタンプの保持(sticky)用ストレージ(ユーザー別)。分類変更で所属社数が増えても🏅を外さないため。
function stampEarnedKey(){ return 'tk_stamps_earned:'+(userId||'guest'); }
function loadEarnedStamps(){ try{ return new Set(JSON.parse(localStorage.getItem(stampEarnedKey())||'[]')); }catch(e){ return new Set(); } }
function saveEarnedStamps(set){ try{ localStorage.setItem(stampEarnedKey(), JSON.stringify([...set])); }catch(e){} }

// v1.5: 業界制覇スタンプラリー
// 押した対象の「業界」と「達成/未達成」を業界研究へ引き継ぐ(押した意味を着地点に残す):
//   open=<slug>(その業界を自動展開) / focus=done|undone(その状態で絞り込み) / done=<達成slug csv>(gyokai側でバッジ表示・追加fetch不要=速度非退行)
function secRally(d){
  const r=d.stamp_rally||{}; const inds=r.industries||[];
  if(!inds.length) return '';
  // ★総数(total)・各業界の所属社数(x.total)は API(D1 industries×companies)由来＝分類ソース(タブH管理)の変更に自動追従。ここに数値の直書きは無い。
  const total=inds.length;
  // 取得済みスタンプは外さない(sticky): 業界の所属社数が増えても、一度🏅なら保持=「進んだものが戻る」を防ぐ。localStorage(ユーザー別)。
  const earned=loadEarnedStamps();
  inds.forEach(x=>{ if(x.total>0 && x.viewed>=x.total) earned.add(x.name); });   // 現在達成を記録(獲得を保存)
  saveEarnedStamps(earned);
  const isEarned=x=> (x.total>0 && x.viewed>=x.total) || earned.has(x.name);      // 現在達成 or 過去達成(保持)
  const done=inds.filter(isEarned).length;                  // 🏅数(保持を含む)
  const started=inds.filter(x=>x.viewed>0).length;
  const doneSlugs=inds.filter(isEarned).map(x=>rallySlug(x.name)).filter(Boolean);
  const doneQS=doneSlugs.length?('&done='+encodeURIComponent(doneSlugs.join(','))):'';
  const cells=inds.map(x=>{
    const isDone=isEarned(x), isStarted=x.viewed>0;
    const slug=rallySlug(x.name);
    // 押した業界(slug)・その状態(focus)・達成一覧(done)を渡す。slug未対応なら focus/done のみで状態絞り込みは効く。
    const href='/gyokai.html?from=mypage&focus='+(isDone?'done':'undone')
      +(slug?('&open='+encodeURIComponent(slug)):'')+doneQS;
    const pct=x.total?Math.round(Math.min(100,x.viewed/x.total*100)):0;
    // 未取得のみ「あと何社で🏅か」を明示(灰色で無反応を解消)。取得済(保持含む)には出さない=進んだ表示を戻さない。N=実所属社数から動的。
    const todo=isDone?'':`<span class="rl-todo">・あと${Math.max(0,x.total-x.viewed)}社で🏅</span>`;
    return `<a class="rl-cell ${isDone?'done':''} ${isStarted?'':'unexp'}" href="${href}">
      <div class="rl-nm">${isDone?'<span class="st">🏅</span>':''}${esc(x.name)}</div>
      <div class="rl-cnt"><b>${x.viewed}</b>/${x.total}社${todo}</div>
      <div class="rl-bar"><i style="width:${pct}%"></i></div></a>`;
  }).join('');
  // FB③: 何のため/1個つく条件/全部でいくつ/現在いくつ を1タップ(?)で表示
  const explain=`<div class="rl-explain" id="rl-explain" hidden>
      <b>これは何？</b> 業界研究の進み具合を見える化する仕組みです。全業界の制覇を目指せます。<br>
      <b>🏅が1個つく条件：</b> その業界の企業を<b>全社</b>見ると付きます。<br>
      <b>ぜんぶで：</b> ${total}個（${total}業界）。<span style="opacity:0.72">※業界の数はトーキャリの分類に合わせて自動更新されます</span><br>
      <b>いま：</b> 🏅<b>${done}</b>個 制覇 ／ ${started}業界に着手中。<br>
      一度取れた🏅は外れません（会社が増えても保持。次に見れば埋まります）。灰色を押すとその業界の研究ページへ。</div>`;
  return `<div class="mp-sec"><div class="mp-h">
      <span class="mp-t">業界制覇<span class="em">スタンプ</span><button class="rl-help" data-rlhelp aria-label="スタンプの説明">?</button></span>
      <span class="mp-more">🏅${done}/${total}</span></div>
    ${explain}
    <div class="rl-grid">${cells}</div></div>`;
}

// 用語ミニ辞書（静的JSON・中立/一般知識のみ）。GALL=lookup, GSORTED=最長一致用。
let GALL=[], GSORTED=[];
async function loadGlossary(){
  try{
    const r=await fetch('/terms_glossary.json'); if(!r.ok) return;
    const j=await r.json();
    GALL=(j.terms||[]).map(x=>({t:x.t,d:x.d,e:esc(x.t)}));
    GSORTED=GALL.map((x,i)=>({...x,i})).sort((a,b)=>b.e.length-a.e.length);
  }catch(e){ GALL=[]; GSORTED=[]; }
}
// 見出し内の用語に点線下線を付与（見出し文言は改変しない・エスケープ済みHTMLを返す）
function annotateGlossary(title){
  const s=esc(title);
  if(!GSORTED.length) return s;
  let out='', i=0;
  while(i<s.length){
    let hit=null;
    for(const g of GSORTED){ if(g.e && s.startsWith(g.e, i)){ hit=g; break; } }
    if(hit){ out+=`<span class="gl" data-i="${hit.i}">${hit.e}</span>`; i+=hit.e.length; }
    else { out+=s[i]; i++; }
  }
  return out;
}
function showGlossaryPop(el, item){
  let pop=document.getElementById('gl-pop');
  if(!pop){ pop=document.createElement('div'); pop.id='gl-pop'; document.body.appendChild(pop); }
  pop.innerHTML=`<span class="gt">${esc(item.t)}</span><span class="gd">${esc(item.d)}</span>`;
  pop.style.visibility='hidden'; pop.style.display='block';
  const pw=Math.min(280, window.innerWidth-24); pop.style.maxWidth=pw+'px';
  const r=el.getBoundingClientRect();
  let left=Math.max(12, Math.min(r.left + r.width/2 - pw/2, window.innerWidth-pw-12));
  const ph=pop.offsetHeight;
  let top, cls;
  if(r.top - ph - 10 > 8){ top=r.top - ph - 10; cls='above'; } else { top=r.bottom + 10; cls='below'; }
  pop.className='gl-pop '+cls;
  pop.style.left=left+'px'; pop.style.top=top+'px';
  const ax=Math.max(10, Math.min(r.left + r.width/2 - left - 6, pw-22));
  pop.style.setProperty('--ax', ax+'px');
  pop.style.visibility='visible';
}
function hideGlossaryPop(){ const p=document.getElementById('gl-pop'); if(p) p.style.display='none'; }
document.addEventListener('click', e=>{
  const g=e.target.closest && e.target.closest('.gl');
  if(g){ e.preventDefault(); e.stopPropagation(); const i=+g.dataset.i; if(GALL[i]) showGlossaryPop(g, GALL[i]); return; }
  // ニュースカードのアコーディオン開閉（用語タップは上で return 済み・公式リンクは nw-exp 内で別要素）
  const head=e.target.closest && e.target.closest('.nw-head');
  if(head){ const it=head.closest('.nw-item'); if(it) it.classList.toggle('open'); hideGlossaryPop(); return; }
  if(!(e.target.closest && e.target.closest('#gl-pop'))) hideGlossaryPop();
});
window.addEventListener('scroll', hideGlossaryPop, true);

// v1.5: 更新フィード
// 取得(fetched_at)から7日以内=新着。fetched_atはUTC "YYYY-MM-DD HH:MM:SS"。
function nwIsNew(fetched){
  if(!fetched) return false;
  const t=Date.parse(String(fetched).replace(' ','T')+'Z');
  if(isNaN(t)) return false;
  return (Date.now()-t) <= 7*86400000 && (Date.now()-t) >= -86400000;
}
function newsNewCompanies(d){
  const off=(d.feed&&d.feed.official)||[]; const s=new Set();
  off.forEach(o=>{ if(nwIsNew(o.fetched_at)) s.add(o.company_id); });
  return s.size;
}
function secNewsJump(d){
  const n=newsNewCompanies(d); if(!n) return '';
  return `<a class="mp-newsjump" id="mp-newsjump" href="#news"><span class="nj-ic">📰</span>お気に入り${n}社に新着ニュース<b>→見る</b></a>`;
}
function goToNews(){
  const el=document.getElementById('news'); if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.querySelectorAll('.nw-item[data-new="1"]').forEach(it=>it.classList.add('open')); // NEWを自動展開

let NEWS=[];                                  // お気に入り企業の公式ニュース(絞り込み/並び替えのソース)
let newsState={co:'',sort:'new',limit:5};
function newsItemHTML(o){

    : `<div class="nw-summary"><span class="nw-slabel">📝 やさしい要約</span>${se ? esc(se) : '<span class="nw-soon">やさしい要約は準備中です</span>'}</div>`;

    <div class="nw-head">
      <div class="nw-top"><span class="nw-co" style="--acc:${hue(o.company_id||o.name)}">${esc(o.name||'')}</span><span class="nw-tag ${g.cls}">${esc(g.label)}</span>${isNew?'<span class="nw-new">NEW</span>':''}<span class="nw-date">${esc(o.date||'')}</span><span class="nw-chev">▼</span></div>

function applyNews(){
  let list=NEWS.slice();
  if(newsState.co) list=list.filter(o=>String(o.company_id||o.name)===newsState.co);
  list.sort((a,b)=> newsState.sort==='old' ? String(a.date||'').localeCompare(String(b.date||'')) : String(b.date||'').localeCompare(String(a.date||'')));
  const total=list.length, shown=list.slice(0,newsState.limit);
  const el=document.getElementById('news-list');
  if(el) el.innerHTML = shown.length? shown.map(newsItemHTML).join('') : `<div class="nw-empty">この条件のニュースはありません</div>`;
  const more=document.getElementById('news-more');
  if(more){ if(total>newsState.limit){ more.style.display='block'; more.textContent=`さらに見る（残り${total-newsState.limit}件）`; } else more.style.display='none'; }
}
function secFeed(d){
  const f=d.feed||{}; const intl=f.internal||[], off=f.official||[];
  NEWS=off.slice(); newsState={co:'',sort:'new',limit:5};
  const kic={quiz:'🧠',datasheet:'📊',eskit:'🧰'};
  let inner='';
  if(off.length){
    // 企業フィルタ選択肢(ニュースが実在する企業のみ・重複除去)
    const seen={}; const cos=[];
    off.forEach(o=>{ const k=String(o.company_id||o.name); if(!seen[k]){ seen[k]=1; cos.push({k,name:o.name||k}); } });
    const coChips = cos.length>1 ? `<div class="nw-chips"><button class="nw-chip on" data-co="">すべて</button>${cos.map(c=>`<button class="nw-chip" data-co="${esc(c.k)}">${esc(c.name)}</button>`).join('')}</div>` : '';
    const ctrl = off.length>1 ? `<div class="nw-ctrl">
        <div class="nw-sorts"><button class="nw-sortb on" data-s="new">新しい順</button><button class="nw-sortb" data-s="old">古い順</button></div>
        ${coChips}</div>` : '';
    inner+=`<div class="fd-sub">お気に入り企業の公式ニュース（タップで要約）</div>${ctrl}
      <div id="news-list">${off.slice(0,newsState.limit).map(newsItemHTML).join('')}</div>
      <button class="nw-more" id="news-more" style="display:${off.length>newsState.limit?'block':'none'}">さらに見る（残り${Math.max(0,off.length-newsState.limit)}件）</button>`;
  }
  if(intl.length){
    // href が無い項目はリンクにせず div で描画＝'#'遷移(先頭スクロール/無反応)を防ぐ。
    inner+=`<div class="fd-sub">トーキャリの新着</div>`+intl.map(i=>{
      const body=`<span class="fd-ic">${kic[i.kind]||'✨'}</span><span class="fd-b"><span class="fd-t">${esc(i.title)}</span><span class="fd-d">${esc(i.detail||'')}</span></span><span class="fd-date">${esc(i.date||'')}</span>`;
      return i.href ? `<a class="fd-item" href="${esc(i.href)}">${body}</a>` : `<div class="fd-item" style="cursor:default">${body}</div>`;
    }).join('');
  }
  if(!inner) return '';
  return `<div class="mp-sec" id="news"><div class="mp-h"><span class="mp-t">更新<span class="em">フィード</span></span></div>${inner}</div>`;
}

    && !((d.stamp_rally||{}).explored);
  let html='';
  if(isNew){
    // 空状態(新規): ブランクにせず、はじめよう導線＋レベル(Lv1)＋スタンプ(未開拓)＋新着 で満たす
    html=`<div class="mp-sec"><div class="mp-empty-all" style="padding:28px 22px">

         + secContinue(d) + secFavorites(d) + secStats(d) + secShindan(d) + secFeed(d);

  // 新着ニュース ジャンプカード(最上部・通知で来た人がすぐ気づける)
  html = secNewsJump(d) + html;
  mp().innerHTML = html;
  // FB①/③: 算出根拠・スタンプ説明のトグル(1タップで開閉・既定は畳んで縦を増やさない)
  const lvh=document.querySelector('[data-lvhelp]'); if(lvh) lvh.onclick=()=>{ const e=document.getElementById('lv-explain'); if(e) e.hidden=!e.hidden; };
  const rlh=document.querySelector('[data-rlhelp]'); if(rlh) rlh.onclick=()=>{ const e=document.getElementById('rl-explain'); if(e) e.hidden=!e.hidden; };
  const eb=document.getElementById('pm-edit-btn'); if(eb) eb.onclick=()=>openProfileModal('edit', PROFILE||{});
  const jc=document.getElementById('mp-newsjump'); if(jc) jc.onclick=(e)=>{ e.preventDefault(); try{history.replaceState(null,'','#news');}catch(_){} goToNews(); };
  if(location.hash==='#favorites'){ const el=document.getElementById('favorites'); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),200); }
  if(location.hash==='#news'){ setTimeout(goToNews, 300); }  // 通知(週1ダイジェスト)から直行
  // お気に入り: 検索/並び替え/業界フィルタの操作を配線
  const fsE=document.getElementById('fav-search'); if(fsE) fsE.addEventListener('input',()=>{ favState.q=fsE.value; applyFav(); });
  document.querySelectorAll('.fav-sortb').forEach(btn=>btn.onclick=()=>{ favState.sort=btn.dataset.s; document.querySelectorAll('.fav-sortb').forEach(x=>x.classList.toggle('on',x===btn)); applyFav(); });
  document.querySelectorAll('.fav-chip').forEach(btn=>btn.onclick=()=>{ favState.ind=btn.dataset.ind; document.querySelectorAll('.fav-chip').forEach(x=>x.classList.toggle('on',x===btn)); applyFav(); });
  // ニュース: 並び替え/企業フィルタ/さらに見る の操作を配線
  document.querySelectorAll('.nw-sortb').forEach(btn=>btn.onclick=()=>{ newsState.sort=btn.dataset.s; newsState.limit=5; document.querySelectorAll('.nw-sortb').forEach(x=>x.classList.toggle('on',x===btn)); applyNews(); });
  document.querySelectorAll('.nw-chip').forEach(btn=>btn.onclick=()=>{ newsState.co=btn.dataset.co; newsState.limit=5; document.querySelectorAll('.nw-chip').forEach(x=>x.classList.toggle('on',x===btn)); applyNews(); });
  const nmBtn=document.getElementById('news-more'); if(nmBtn) nmBtn.onclick=()=>{ newsState.limit+=5; applyNews(); };
  // ニュース(更新フィード)が実際に画面へ入ったら「ニュース閲覧」を1回計測(company.htmlのkoma_read同様IO方式)。
  const nv=document.getElementById('news');
  if(nv && 'IntersectionObserver' in window){
    let nvLogged=false;
    const nio=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting && !nvLogged){ nvLogged=true; if(window.tkEvent) tkEvent('feature','ニュース閲覧'); nio.disconnect(); } }); });
    nio.observe(nv);
  }
}

        <select class="pm-select" id="pm-fac"><option value="">選択してください</option>${P_FAC.map(f=>`<option ${st.faculty===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div class="pm-field"><label class="pm-label">卒業年度</label>
        <select class="pm-select" id="pm-grad"><option value="">選択してください</option>${P_GRAD.map(g=>`<option ${st.grad===g?'selected':''}>${g}</option>`).join('')}</select></div>`;
    if(st.type==='student_pre') return `
      <div class="pm-field"><label class="pm-label">卒業予定年（任意）</label>
        <select class="pm-select" id="pm-grad"><option value="">未選択でもOK</option>${P_GRAD.map(g=>`<option ${st.grad===g?'selected':''}>${g}</option>`).join('')}</select></div>`;
    return '';
  }
  function valid(){
    if(!st.type||!st.consent) return false;
    if(st.type==='student_univ' && (!st.university||!st.faculty||!st.grad)) return false;
    return true;
  }
  function refresh(){ const s=host.querySelector('#pm-submit'); if(s) s.disabled=!valid(); }
  function draw(){
    host.innerHTML=`<div class="pm-card">
      <div class="pm-h1">あなたにぴったりの情報を届けるために</div>
      <div class="pm-h2">はじめまして！最初に30秒だけ、3つ教えてください。</div>
      <div class="pm-lead">学年や学部に合わせて、おすすめの企業や業界情報があなた仕様になります。</div>
      <div class="pm-q">いまのあなたに一番近いのは？</div>
      <div class="pm-opts">${P_TYPES.map(t=>`<button class="pm-opt ${st.type===t.v?'on':''}" data-t="${t.v}"><span class="rd"></span>${t.l}</button>`).join('')}</div>
      <div id="pm-fields">${fieldsHTML()}</div>
      <div class="pm-note"><b>入力内容について</b><br>
        ・入力いただいた大学・学部・卒業年度は、あなたに合ったおすすめ企業・コンテンツの表示に使います。<br>
        ・今後、あなたのことを「ぜひ会いたい」と思った企業から、直接スカウト（オファー）が届く機能を準備しています。その際、大学・学部・卒業年度を参加企業にお伝えすることがあります。<br>
        ・氏名・住所・電話番号などは取得しません。入力内容はマイページからいつでも変更・削除できます。</div>
      <label class="pm-consent"><input type="checkbox" id="pm-consent" ${st.consent?'checked':''}>上記に同意して、自分に合った情報を受け取る</label>
      <button class="pm-submit" id="pm-submit">はじめる →</button>
      ${mode==='edit'?'<button class="pm-del" id="pm-del">この情報を削除する（初回登録に戻る）</button>':''}
    </div>`;
    host.querySelectorAll('.pm-opt').forEach(b=>b.onclick=()=>{ st.type=b.dataset.t; st.university='';st.faculty='';st.grad=''; draw(); });
    const uni=host.querySelector('#pm-uni'), sugg=host.querySelector('#pm-sugg');
    if(uni) uni.addEventListener('input',()=>{ const q=uni.value.trim(); st.university=''; refresh();
      if(!q){ sugg.style.display='none'; return; }
      const hits=UNIV.filter(u=>u.includes(q)).slice(0,20);
      sugg.style.display=hits.length?'block':'none';
      sugg.innerHTML=hits.map(u=>`<div data-u="${esc(u)}">${esc(u)}</div>`).join('');
      sugg.querySelectorAll('div').forEach(d=>{ const pick=e=>{ e.preventDefault(); st.university=d.dataset.u; uni.value=d.dataset.u; sugg.style.display='none'; refresh(); }; d.addEventListener('pointerdown',pick); d.addEventListener('click',pick); });
    });
    const fac=host.querySelector('#pm-fac'); if(fac) fac.onchange=()=>{ st.faculty=fac.value; refresh(); };
    const grad=host.querySelector('#pm-grad'); if(grad) grad.onchange=()=>{ st.grad=grad.value; refresh(); };
    host.querySelector('#pm-consent').onchange=e=>{ st.consent=e.target.checked; refresh(); };
    host.querySelector('#pm-submit').onclick=async()=>{
      if(!valid()) return;
      const body={ user_id:userId, user_type:st.type, university:st.university||null, faculty:st.faculty||null, grad_year:st.grad||null, consented:true, consent_version:CONSENT_VERSION };
      try{ await fetch(`${API_BASE}/api/profile`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }catch(e){}
      PROFILE={ user_type:st.type, university:body.university, faculty:body.faculty, grad_year:body.grad_year }; CAN_EDIT=true;
      host.remove(); startMypage();
    };
    const del=host.querySelector('#pm-del'); if(del) del.onclick=async()=>{
      try{ await fetch(`${API_BASE}/api/profile/delete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId})}); }catch(e){}
      PROFILE=null; CAN_EDIT=false; host.remove(); openProfileModal('register');  // 削除→初回扱い
    };
    refresh();
  }
  draw();
}

async function startMypage(){
  const gp=loadGlossary();   // 用語辞書を並行ロード(フィード注釈に必要)
  // ゲスト(LINE外・未ログイン=userId未確定/guest-preview)は共有レコードを絶対に出さない。
  // 個人記録(XP・足あと・続きから・お気に入り・成績・診断)を一切fetch/表示せず、ログイン案内の空状態にする。
  // ?u= によるQAオーバーライドは userId が実値になるので下の実ユーザー経路を通る(従来どおり)。
  const isReal = userId && userId!=='guest-preview';
  if(!isReal){
    try{ await gp; }catch(e){}
    mp().innerHTML = `<div class="mp-sec"><div class="mp-empty-all" style="padding:28px 22px">
      <div class="ei">🔒</div><div class="et">ログインすると記録が残ります</div>
      <div class="es">LINEでログインすると、就活レベル・足あと・続きから・お気に入り・成績・診断が<br>ここに保存されます。</div>
      <a href="/home">ホームへ戻る →</a></div></div>`;
    return;
  }
  let d=null;
  try{ const r=await fetch(`${API_BASE}/api/mypage?userId=${encodeURIComponent(userId)}`); if(r.ok) d=await r.json(); }catch(e){}
  if(!d) d={continue:{recent:[],quiz_resume:null},bookmarks:[],quiz_stats:{companies:0,accuracy:null,answered:0,recent_scores:[]},shindan:null};
  try{ await gp; }catch(e){}
  render(d);
}

async function main(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()&&liff.isInClient()){liff.login();return;}
    if(liff.isLoggedIn()){ try{ const p=await liff.getProfile(); if(!new URLSearchParams(location.search).get('u')) userId=p.userId; if(p.displayName) document.getElementById('mp-greet').textContent=`📓 ${p.displayName}さんの就活記録 — 足あと・お気に入り・成績・診断`; }catch(e){} }
  }catch(e){ console.warn('LIFF skipped (preview):', e&&e.message); }
  // リッチメニュー枠=マイページ 到達を計測。実ユーザーなら__tkUserでUU化(preview/ゲストはanonで1行)。
  if(userId && userId!=='guest-preview') window.__tkUser=userId;
  if(window.tkEvent) tkEvent('menu','マイページ');
  // LIFF外/ゲスト(userId取れない)はモーダルを出さず従来ゲスト表示
  const isReal = userId && userId!=='guest-preview';
  if(isReal){
    let prof=null;
    try{ const r=await fetch(`${API_BASE}/api/profile?userId=${encodeURIComponent(userId)}`); if(r.ok) prof=await r.json(); }catch(e){}
    if(prof && !prof.registered){ openProfileModal('register'); return; }  // 登録完了まで本体を表示しない
    if(prof && prof.registered){ PROFILE=prof.profile; CAN_EDIT=true; }
  }
  startMypage();
}
// FB②: 8目的を常時展開。定義は purpose_map.js(唯一の正)を参照。API/ログイン非依存＝即描画(速度非退行)。
function renderGoals(){
  const host=document.getElementById('mp-goals'); if(!host||!window.PURPOSE_MAP) return;
  host.innerHTML=window.PURPOSE_MAP.map(p=>`
    <a class="mp-goal" href="/today?p=${encodeURIComponent(p.id)}" onclick="if(window.tkEvent)tkEvent('menu','目的:${p.id}(mypage)')">
      <span class="gi">${p.icon}</span><span class="gl">${esc(p.label)}</span></a>`).join('');
}
renderGoals();
main();
</script>
