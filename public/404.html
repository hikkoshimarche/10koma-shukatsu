<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="/base.css">
<title>ページが見つかりません｜トーキャリ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/brand/tokyari_logo_mark.jpg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:40px 24px;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:radial-gradient(120% 140% at 12% 8%,#0a4a8f 0%,#003F7D 45%,#002d5c 100%);color:#fff}
  .logo{height:34px;width:auto;margin-bottom:28px;opacity:.95}
  .code{font-size:64px;font-weight:900;letter-spacing:.04em;color:#e7c66b;line-height:1}
  h1{font-size:20px;font-weight:800;margin:14px 0 8px}
  p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.85);max-width:22em}
  .btn{margin-top:26px;display:inline-block;background:#e7c66b;color:#002d5c;font-weight:800;font-size:15px;
    text-decoration:none;padding:13px 28px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .btn:active{opacity:.85}
</style>
</head>
<body>
  <img class="logo" src="/images/brand/tokyari_logo_wide.png" alt="トーキャリ">
  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは移動または削除された可能性があります。トップページからやり直してください。</p>
  <a class="btn" href="/lp/">トップへ戻る</a>
</body>
</html>
